<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">TC</div>

      <span class="pill" id="pillLibrary"><i></i><span>Knihovna: načítám…</span></span>
      <span class="pill" id="pillClaude"><i></i><span>AI: zjišťuji…</span></span>

    </div>
  </header>

  <div class="layout">
    <nav class="nav" id="nav" aria-label="Sekce"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>

<aside class="drawer" id="drawer" hidden aria-label="Panel">
  <header><h2 id="drawerTitle"></h2><button class="btn small" id="drawerClose" type="button">Zavřít</button></header>
