# Samostatná verze aplikace (instalovatelná PWA) na GitHub Pages.
# Jednorázově ji musí majitel zapnout: Settings → Pages → Source: GitHub Actions
# https://github.com/janvasilecko-droid/fm27-apka/settings/pages
name: Samostatná aplikace (GitHub Pages)

on:
  # Zatím jen ručně (Actions → Run workflow). Až bude Pages zapnuté a první nasazení projde, přidá se i spouštění po každém pushi.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy jádra
        run: node --test trener/test/*.test.mjs
      - name: Sestavení (všechny moduly povinné)
        run: STRICT=1 node trener/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trener/dist/standalone

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
