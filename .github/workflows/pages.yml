# Samostatná verze aplikace (instalovatelná PWA) na GitHub Pages.
# Majitel ji zapnul (Settings → Pages → Source: GitHub Actions)
# https://github.com/janvasilecko-droid/fm27-apka/settings/pages
name: Samostatná aplikace (GitHub Pages)

on:
  # Ručně (Actions → Run workflow) a automaticky po změně aplikace na větvi main (první nasazení prošlo 5. 11. 2026).
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trener/**'
      - 'reference/codex-2026-11-01/knowledge.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy jádra
        run: node --test trener/test/*.test.mjs
      - name: Sestavení (všechny moduly povinné)
        run: STRICT=1 node trener/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trener/dist/standalone

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
