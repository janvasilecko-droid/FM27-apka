# Samostatná verze aplikace (instalovatelná PWA) na GitHub Pages.
# Majitel ji zapnul (Settings → Pages → Source: GitHub Actions)
# https://github.com/janvasilecko-droid/fm27-apka/settings/pages
name: Samostatná aplikace (GitHub Pages)

on:
  # Ručně (Actions → Run workflow) a automaticky po změně aplikace na větvi main (první nasazení prošlo 5. 11. 2026).
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trener/**'
      # soubory mimo trener/, které čtou sestavení a zkoušky jádra (registr zdrojů, plán taktiky, ceník AI, ke kterému se porovnává ceník v JS)
      - 'reference/codex-2026-11-01/**'
      - 'ai_gateway/costs.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Známé omezení, zatím neopravené: GitHub při každém běhu varuje, že akce checkout@v4, setup-node@v4, upload-artifact@v4 (volá ji upload-pages-artifact@v3) a deploy-pages@v4 míří na zastaralý Node.js 20
  # a runner je nuceně spouští na Node.js 24. Novější hlavní verze akcí se nepodařilo ověřit, proto se verze nemění (viz trener/README.md, část „CI na GitHubu“).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Věštírna libzstd (Python balíček zstandard) se tady výslovně vypíná: systémový python3 na runneru má balíček v neznámé, nepřipnuté verzi
      # a změna obrazu runneru by mohla zablokovat nasazení bez jakékoli změny v repozitáři. Porovnání dekodéru zstd s libzstd přes věštírnu dělá samostatné
      # zstd-oracle.yml s připnutým zstandard==0.25.0 (povinná věštírna); tady se tři porovnávací zkoušky viditelně přeskočí.
      - name: Testy jádra (bez věštírny libzstd)
        env:
          ZSTD_ORACLE_PYTHON: /nonexistent/python
        run: node --test trener/test/*.test.mjs
      - name: Sestavení (všechny moduly povinné)
        run: STRICT=1 node trener/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trener/dist/standalone

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
