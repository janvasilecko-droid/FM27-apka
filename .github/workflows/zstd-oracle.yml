# Vlastní dekodér zstd (trener/src/zstd.js) proti referenčnímu libzstd: Python balíček zstandard 0.25.0 (libzstd 1.5.7), na kterém se zkoušky ladily.
# Je to samostatná kontrola mimo nasazení stránky: nasazení (pages.yml) Python nepotřebuje a na výsledku téhle kontroly nezávisí.
# Bez věštírny (balíčku) se porovnání s libzstd v běžných zkouškách přeskočí; tady jsou povinná (ZSTD_ORACLE_REQUIRED=1), takže bez balíčku zkouška selže.
name: Dekodér zstd proti libzstd

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trener/src/zstd.js'
      - 'trener/src/fmfglue.js'
      - 'trener/test/zstd.test.mjs'
      - 'trener/test/fixtures/zstd_*'
      - '.github/workflows/zstd-oracle.yml'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Věštírna (libzstd přes Python)
        run: python -m pip install zstandard==0.25.0
      - name: Zkoušky dekodéru proti libzstd (povinná věštírna)
        run: ZSTD_ORACLE_REQUIRED=1 ZSTD_ORACLE_PYTHON=python node --test trener/test/zstd.test.mjs
