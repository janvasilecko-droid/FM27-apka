# Vlastní dekodér zstd (trener/src/zstd.js) proti referenčnímu libzstd: Python balíček zstandard 0.25.0 (libzstd 1.5.7), na kterém se zkoušky ladily.
# Je to samostatná kontrola mimo nasazení stránky a jediné místo v CI, kde se dekodér porovnává s libzstd přes věštírnu (Python zstandard==0.25.0: rozhodnutí o vadných a ručně sestavených rámcích proti libzstd).
# Nasazení (pages.yml) věštírnu výslovně vypíná (ZSTD_ORACLE_PYTHON=/nonexistent/python; systémový python na runneru má nepřipnutou verzi zstandard), ale dál rozbaluje rámce, které napsala libzstd z Node
# (zlib.zstdCompressSync), a v kontejneru srovnává dekodér s dekodérem libzstd z Node (zlib.zstdDecompressSync, fmfcontainer.test.mjs); na výsledku téhle kontroly nezávisí.
# Bez věštírny (balíčku) se porovnání s libzstd přes věštírnu v běžných zkouškách přeskočí; tady je povinné (ZSTD_ORACLE_REQUIRED=1), takže bez balíčku zkouška selže.
name: Dekodér zstd proti libzstd

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trener/src/zstd.js'
      - 'trener/src/fmfglue.js'
      - 'trener/test/zstd.test.mjs'
      - 'trener/test/fixtures/zstd_*'
      - '.github/workflows/zstd-oracle.yml'

permissions:
  contents: read

jobs:
  # Známé omezení, zatím neopravené: GitHub při každém běhu varuje, že akce checkout@v4, setup-node@v4 a setup-python@v5 míří na zastaralý Node.js 20
  # a runner je nuceně spouští na Node.js 24. Novější hlavní verze akcí se nepodařilo ověřit, proto se verze nemění (viz trener/README.md, část „CI na GitHubu“).
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Věštírna (libzstd přes Python)
        run: python -m pip install zstandard==0.25.0
      - name: Zkoušky dekodéru proti libzstd (povinná věštírna)
        run: ZSTD_ORACLE_REQUIRED=1 ZSTD_ORACLE_PYTHON=python node --test trener/test/zstd.test.mjs
